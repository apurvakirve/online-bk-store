name: Java CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        run: mvn clean compile

      - name: Run Tests
        run: mvn test

      - name: Package
        run: mvn package -DskipTests

      - name: Verify Artifact
        run: ls -lh target/
